<!doctype html>
<!--
  PLANTILLA «PRODUCTO 3D CON MASCOTA» · un producto 3D realista y la mascota 3D de la marca, solapados, sobre un
  degradado profundo con partículas y bokeh tenues, sombras de contacto y el logo centrado arriba. Cinco formatos de
  una misma campaña:
    hero (1600x900, redondeado), redes-1x1 (1080x1080), redes-4x5 (1080x1350), banner-x (1500x500) y
    story (1080x1920).
  Exportar a 2x (PNG nítido), desde la carpeta de esta plantilla, con producto-3d-mascota.css y recortes/ al lado:
    node ../../piezas-graficas/scripts/exportar.mjs producto-3d-mascota.html --marca marca-ejemplo.json --escala 2
  Reglas:
    · La marca sale de marca.json (skill direccion-de-arte): colores y fuentes en var(--…), y nombre, web y logo en
      los elementos con data-marca. Aquí no se escribe ningún color suelto.
    · Producto y mascota son <img data-recorte> (WebP o PNG con alfa, renderizados con la luz de la marca): ningún
      texto puede pisar su parte opaca. Dentro de cada .sujeto va su sombra de contacto (.contacto, data-fondo).
    · Partículas, bokeh, luces y sombras van en capas data-fondo con aria-hidden="true" (ahí sí vale filter: blur).
    · Nada de box-shadow de color ni text-shadow: la luz de color está en los renders y en el fondo.
    · Zonas sin texto: banner-x, la foto de perfil (abajo a la izquierda, ~400x200) y 60 px arriba y abajo (móvil);
      story, 250 px arriba y 340 abajo.
  Contenido de ejemplo: Cometa, tienda de gaming ficticia; Chispa, su mascota; una torre gaming blanca sin marca.
-->

    --tinta: #0d0b24; --texto: #2b2846; --suave: #5f5b7a; --apagado: #807c98; --linea: #e0ddef;
    --noche: #0a0a26; --noche-2: #141238; --noche-linea: #262357; --claro: #f5f3ff; --claro-suave: #a9a4cf;
    --acento: #8b6bff; --acento-texto: #5a37e0; --sobre-acento: #0a0a26;
    --fuente: 'Plus Jakarta Sans', system-ui, sans-serif;   /* --fuente-display: solo si la marca la trae (tipografia.display) */
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --radio: 28px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  /* La página pinta las esquinas de la pieza redondeada: --pagina (por defecto, el papel de la marca) */
  body { background: var(--m3-pagina); padding: 60px; display: flex; flex-direction: column; align-items: flex-start; gap: 60px; font-family: var(--fuente) }
</style>
</head>
